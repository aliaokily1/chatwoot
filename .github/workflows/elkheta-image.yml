# Builds the Elkheta Chatwoot image (Community Edition) and publishes it to GitHub Container Registry.
# Railway's Rails and Sidekiq services run this image.
name: Build Elkheta image

on:
  push:
    branches:
      - elkheta
      # Upstream updates are built and tested before they reach elkheta (see UPSTREAM-UPDATE-GUIDE.md)
      - 'upstream-update/**'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

# New pushes wait for the running build instead of cancelling it.
concurrency:
  group: elkheta-image
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Strip enterprise code (Community Edition)
        run: |
          rm -rf enterprise
          rm -rf spec/enterprise
          echo -en '\nENV CW_EDITION="ce"' >> docker/Dockerfile

      - name: Set image name and tags
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chatwoot" >> "$GITHUB_ENV"
          echo "SHORT_SHA=${GITHUB_SHA::7}" >> "$GITHUB_ENV"
          # Only the elkheta branch moves the "latest" tag; update branches get their sha tag only
          if [ "$GITHUB_REF_NAME" = "elkheta" ]; then
            echo "LATEST_TAG=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/chatwoot:elkheta-latest" >> "$GITHUB_ENV"
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE }}:elkheta-${{ env.SHORT_SHA }}
            ${{ env.LATEST_TAG }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Chatwoot CE with Elkheta changes
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Summary
        run: echo "Published ${IMAGE}:elkheta-${SHORT_SHA}" >> "$GITHUB_STEP_SUMMARY"
